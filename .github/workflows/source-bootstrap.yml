name: TakaTrack source bootstrap

on:
  push:
    branches:
      - implementation/takatrack
    paths:
      - ".github/workflows/source-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: implementation/takatrack
          fetch-depth: 0

      - name: Reconstruct verified source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/source-*.b64 > /tmp/takatrack-source.b64
          base64 --decode /tmp/takatrack-source.b64 > /tmp/takatrack-source.tar.gz
          echo "4b5fdce1f034b0e86cce23d9ec3856318a3a31a001ff6864d3a7f56ebdeb5692  /tmp/takatrack-source.tar.gz" | sha256sum -c -
          tar -tzf /tmp/takatrack-source.tar.gz >/dev/null
          tar -xzf /tmp/takatrack-source.tar.gz -C .

      - name: Replace bootstrap artifacts with normal CI
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap .delivery
          rm -f .github/workflows/dependency-bootstrap.yml
          rm -f .github/workflows/source-bootstrap.yml
          mkdir -p .github/workflows
          cat > .github/workflows/ci.yml <<'YAML'
          name: TakaTrack CI

          on:
            push:
              branches:
                - master
                - implementation/takatrack
            pull_request:

          permissions:
            contents: read

          jobs:
            verify:
              runs-on: ubuntu-latest
              timeout-minutes: 25
              steps:
                - name: Checkout
                  uses: actions/checkout@v4
                - name: Setup Node
                  uses: actions/setup-node@v4
                  with:
                    node-version: "22"
                    cache: npm
                - name: Install dependencies
                  run: npm ci --no-audit --no-fund
                - name: Typecheck, lint, unit, build, integration
                  run: npm run check
                - name: Install Chromium
                  run: npx playwright install --with-deps chromium
                - name: Responsive render tests
                  run: npm run test:e2e
          YAML

      - name: Commit full application source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete TakaTrack application"
          git push origin HEAD:implementation/takatrack
